services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentos"]
      interval: 2s
      timeout: 2s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.conf"]
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - ./.data/seaweed:/data
      - ./infra/seaweedfs/s3.conf:/etc/seaweedfs/s3.conf:ro

  pi:
    image: node:24-alpine
    working_dir: /work
    command:
      [
        "sh",
        "-lc",
        "corepack enable && tail -f /dev/null | pnpm exec pi --mode rpc --provider ${PI_PROVIDER:-github-copilot} --model ${PI_MODEL:-gpt-4.1}"
      ]
    volumes:
      - ./:/work
      - ${HOME}/.pi/agent:/root/.pi/agent

  api:
    image: node:24-alpine
    working_dir: /work
    command:
      [
        "sh",
        "-lc",
        "apk add --no-cache docker-cli >/dev/null && corepack enable && pnpm exec tsx apps/api/src/server.ts",
      ]
    volumes:
      - ./:/work
      - ./:${PWD}
      - ${HOME}/.pi/agent:/root/.pi/agent:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentos
      DBOS_SYSTEM_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentos
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: agentos
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: key
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: key
      PI_RPC_URL: stdio://pi
      PI_PROVIDER: ${PI_PROVIDER:-github-copilot}
      PI_MODEL: ${PI_MODEL:-gpt-4.1}
      PI_RPC_STRICT_REAL: ${PI_RPC_STRICT_REAL:-0}
      SANDBOX_WORK_ROOT: ${PWD}/.cache/sandbox/work
      SANDBOX_INPUTS_ROOT: ${PWD}/.cache/sandbox/inputs
      SANDBOX_PI_HOME_ROOT: ${PWD}/.cache/sandbox/pi-home
      SANDBOX_RUNTIME_NODE_MODULES_ROOT: ${PWD}/node_modules
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      pi:
        condition: service_started

  web:
    image: node:24
    working_dir: /work
    command:
      [
        "sh",
        "-lc",
        "corepack enable && pnpm --filter @forkloom/web exec vite --host 0.0.0.0 --port 5173"
      ]
    volumes:
      - ./:/work
    environment:
      VITE_API_ORIGIN: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

  worker:
    profiles: ["worker"]
    image: node:24-alpine
    working_dir: /work
    command: ["sh", "-lc", "tail -f /dev/null"]
    volumes:
      - ./:/work
      - ${HOME}/.pi/agent:/root/.pi/agent:ro
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentos
      DBOS_SYSTEM_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentos
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: agentos
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: key
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: key
      PI_PROVIDER: ${PI_PROVIDER:-github-copilot}
      PI_MODEL: ${PI_MODEL:-gpt-4.1}
      PI_RPC_STRICT_REAL: ${PI_RPC_STRICT_REAL:-0}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
