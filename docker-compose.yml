services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentos"]
      interval: 2s
      timeout: 2s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.conf"]
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - ./.data/seaweed:/data
      - ./infra/seaweedfs/s3.conf:/etc/seaweedfs/s3.conf:ro
